<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" width="100%" height="100%">
  <!-- Definition of filters/styles if needed -->
  <g id="heaven-furniture-mart-logo">
    <!-- "HE" -->
    <text x="18" y="52" font-family="'Montserrat', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" letter-spacing="1" fill="currentColor">HE</text>
    
    <!-- Stylized Architectural Golden 'A' -->
    <g transform="translate(108, 6)">
      <!-- Main Triangular Legs -->
      <path d="M22 2 L2 47 L12.5 47 L16.8 36.5 L27.2 36.5 L31.5 47 L42 47 Z" fill="#E5A83B" />
      <!-- Top inner negative space triangle -->
      <polygon points="22,17 17.5,29 26.5,29" fill="var(--logo-cutout, #16292B)" />
      <!-- Characteristic Extended Horizontal Crossbar (Chair/Easel wings) -->
      <rect x="0" y="27.5" width="44" height="6.5" rx="1.5" fill="#E5A83B" />
      <!-- Stepped Base Footings -->
      <rect x="0.5" y="44" width="13" height="4" rx="1" fill="#E5A83B" />
      <rect x="30.5" y="44" width="13" height="4" rx="1" fill="#E5A83B" />
    </g>

    <!-- "VEN" -->
    <text x="156" y="52" font-family="'Montserrat', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" letter-spacing="1" fill="currentColor">VEN</text>
    
    <!-- "FURNITURE MART" Subtitle -->
    <text x="160" y="76" text-anchor="middle" font-family="'Montserrat', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" letter-spacing="6.8" fill="currentColor">FURNITURE MART</text>
  </g>
</svg>
